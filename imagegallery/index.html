<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>📸 My Image Gallery</h1>
        <p>Explore Beautiful Images</p>
    </header>


    <!-- FILTER BUTTONS -->
    <div class="filters">

        <button class="filter-btn active"
                onclick="filterImages('all', this)">
            All
        </button>

        <button class="filter-btn"
                onclick="filterImages('nature', this)">
            Nature
        </button>

        <button class="filter-btn"
                onclick="filterImages('city', this)">
            City
        </button>

        <button class="filter-btn"
                onclick="filterImages('animals', this)">
            Animals
        </button>

    </div>


    <!-- IMAGE GALLERY -->
    <main class="gallery">

        <div class="image-card nature">
            <img src="https://picsum.photos/id/1015/800/600"
                 alt="Nature Image"
                 onclick="openLightbox(0)">
        </div>

        <div class="image-card nature">
            <img src="https://picsum.photos/id/1016/800/600"
                 alt="Nature Image"
                 onclick="openLightbox(1)">
        </div>

        <div class="image-card city">
            <img src="https://picsum.photos/id/1011/800/600"
                 alt="City Image"
                 onclick="openLightbox(2)">
        </div>

        <div class="image-card animals">
            <img src="https://picsum.photos/id/1025/800/600"
                 alt="Animal Image"
                 onclick="openLightbox(3)">
        </div>

        <div class="image-card nature">
            <img src="https://picsum.photos/id/1039/800/600"
                 alt="Nature Image"
                 onclick="openLightbox(4)">
        </div>

        <div class="image-card city">
            <img src="https://picsum.photos/id/1043/800/600"
                 alt="City Image"
                 onclick="openLightbox(5)">
        </div>

        <div class="image-card animals">
            <img src="https://picsum.photos/id/237/800/600"
                 alt="Dog Image"
                 onclick="openLightbox(6)">
        </div>

        <div class="image-card nature">
            <img src="https://picsum.photos/id/1056/800/600"
                 alt="Nature Image"
                 onclick="openLightbox(7)">
        </div>

    </main>


    <!-- LIGHTBOX -->
    <div id="lightbox" class="lightbox">

        <button class="close"
                onclick="closeLightbox()">
            &times;
        </button>

        <button class="prev"
                onclick="previousImage()">
            &#10094;
        </button>

        <img id="lightbox-image"
             src=""
             alt="Large Image">

        <button class="next"
                onclick="nextImage()">
            &#10095;
        </button>

    </div>


    <!-- FOOTER -->
    <footer>
        <p>© 2026 My Image Gallery</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
